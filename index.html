<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OBD Cockpit" />
  <title>Yamaha RMAX Pro Cockpit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

    :root {
      --bg: #05070e;
      --card-bg: rgba(16, 23, 41, 0.75);
      --card-border: rgba(56, 189, 248, 0.15);
      --card-glow: rgba(56, 189, 248, 0.05);
      --text: #f8fafc;
      --text-muted: #64748b;
      --cyan: #38bdf8;
      --green: #4ade80;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #c084fc;
      --redline: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #070b14 0%, #030408 100%);
      color: var(--text);
      padding: 0.75rem 0.75rem 5.5rem 0.75rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0.25rem 0.75rem 0.25rem;
    }

    .brand-container { display: flex; align-items: center; gap: 0.5rem; }
    .brand-title {
      display: flex; align-items: center; gap: 0.4rem; font-size: 1.15rem;
      font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #fff;
    }
    .brand-glow {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
    }
    .version-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; font-weight: 700;
      padding: 0.15rem 0.45rem; border-radius: 6px; background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3); color: var(--cyan);
    }

    .hud-widgets { display: flex; align-items: center; gap: 0.4rem; }
    .status-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 700;
      padding: 0.35rem 0.65rem; border-radius: 9999px; background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-muted); letter-spacing: 0.05em;
    }
    .status-badge.connected {
      background: rgba(74, 222, 128, 0.15); border-color: var(--green); color: var(--green);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.25);
    }
    .status-badge.simulated {
      background: rgba(192, 132, 252, 0.15); border-color: var(--purple); color: var(--purple);
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.25);
    }

    .btn-hud-icon {
      background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text); width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem;
    }
    .btn-hud-icon:active { transform: scale(0.92); }

    .view-panel { display: none; flex-direction: column; gap: 0.75rem; flex: 1; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Cockpit Hero Gauge */
    .cockpit-hero {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px;
      padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 20px var(--card-glow);
      backdrop-filter: blur(12px);
    }
    .gauge-wrapper { position: relative; width: 240px; height: 200px; display: flex; align-items: center; justify-content: center; }
    .gauge-svg { width: 240px; height: 200px; transform: rotate(-30deg); }
    .gauge-bg-track { fill: none; stroke: rgba(255, 255, 255, 0.06); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 293.2; stroke-dashoffset: 0; }
    .gauge-val-track {
      fill: none; stroke: var(--cyan); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 293.2; stroke-dashoffset: 293.2;
      transition: stroke-dashoffset 0.12s linear, stroke 0.25s ease; filter: drop-shadow(0 0 8px var(--cyan));
    }
    .gauge-center-readout {
      position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; display: flex; flex-direction: column; align-items: center;
    }
    .gauge-center-val { font-size: 3.5rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .gauge-center-unit { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-top: 0.2rem; }
    .redline-indicator { position: absolute; bottom: 8px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.15em; color: var(--redline); opacity: 0; }
    .redline-indicator.active { opacity: 1; animation: pulseGlow 0.4s infinite alternate; }
    @keyframes pulseGlow { from { opacity: 0.4; } to { opacity: 1; text-shadow: 0 0 10px var(--redline); } }

    /* Touch Metric Cards */
    .cockpit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .touch-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 0.85rem 1rem;
      display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25); position: relative; overflow: hidden; cursor: pointer;
    }
    .touch-card:active { transform: scale(0.98); background: rgba(30, 41, 59, 0.9); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
    .card-toggle-hint { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; background: rgba(255, 255, 255, 0.05); color: var(--cyan); font-weight: 600; }
    .card-main { margin: 0.4rem 0; display: flex; align-items: baseline; gap: 0.35rem; }
    .card-val { font-size: 2.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
    .card-unit { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .meter-bar-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; margin-top: 0.2rem; }
    .meter-bar-fill { height: 100%; width: 0%; background: var(--cyan); border-radius: 9999px; transition: width 0.15s linear; box-shadow: 0 0 6px var(--cyan); }

    /* Action Grid & Console */
    .disc-section {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.75rem; backdrop-filter: blur(8px);
    }
    .disc-title { font-size: 0.95rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; }
    .terminal-row { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1; background: #020617; border: 1px solid var(--card-border); color: #fff; padding: 0.75rem;
      border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; text-transform: uppercase; user-select: text;
    }
    .btn-touch {
      background: rgba(56, 189, 248, 0.15); border: 1px solid var(--cyan); color: #fff; padding: 0.65rem 1rem;
      border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .btn-touch:active { transform: scale(0.96); background: var(--cyan); color: #000; }
    .btn-touch.secondary { background: #1e293b; border-color: rgba(255,255,255,0.1); color: var(--text); }
    .btn-touch.yamaha { background: rgba(74, 222, 128, 0.2); border-color: var(--green); color: var(--green); }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }

    .terminal-box {
      background: #020617;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.4;
      flex: 1;
      max-height: calc(100vh - 360px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    /* Bottom Touch Dock */
    .touch-dock {
      position: fixed; bottom: 0.75rem; left: 0.75rem; right: 0.75rem; background: rgba(10, 15, 29, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 0.4rem 0.5rem; display: flex;
      justify-content: space-between; align-items: center; gap: 0.3rem; backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); z-index: 100;
    }
    .dock-btn {
      flex: 1; padding: 0.6rem 0.1rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
    }
    .dock-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .dock-btn span { font-size: 0.65rem; font-weight: 700; }
    .dock-btn:active { transform: scale(0.92); }
    .dock-btn.active { color: var(--cyan); background: rgba(56, 189, 248, 0.12); }
    .dock-action-btn {
      padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.75rem; font-weight: 800; border: none;
      cursor: pointer; display: flex; align-items: center; gap: 0.3rem; background: var(--cyan); color: #05070e;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .dock-action-btn:active { transform: scale(0.94); }
    .dock-action-btn.disconnect { background: var(--red); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); }

    #log {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); min-height: 40px;
      max-height: 50px; overflow-y: auto; background: #020617; padding: 0.4rem 0.6rem; border-radius: 8px; border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <!-- Top HUD Header -->
  <header>
    <div class="brand-container">
      <div class="brand-title">
        <span class="brand-glow"></span>
        YAMAHA COCKPIT
      </div>
      <span class="version-tag" id="app-version-badge">v1.1.0</span>
    </div>
    <div class="hud-widgets">
      <span id="status" class="status-badge">DISCONNECTED</span>
      <button class="btn-hud-icon" onclick="toggleSimulator()" title="Toggle Simulator">⚡</button>
      <button class="btn-hud-icon" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>
  </header>

  <!-- TAB 1: Cockpit Dashboard -->
  <div id="tab-dash" class="view-panel" style="display: flex;">
    <div class="cockpit-hero">
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 200 200">
          <circle class="gauge-bg-track" cx="100" cy="100" r="70"></circle>
          <circle id="gauge-rpm-bar" class="gauge-val-track" cx="100" cy="100" r="70"></circle>
        </svg>
        <div class="gauge-center-readout">
          <span id="val-dash-rpm" class="gauge-center-val">--</span>
          <span class="gauge-center-unit">RPM</span>
        </div>
        <div id="redline-alert" class="redline-indicator">REDLINE</div>
      </div>
    </div>

    <div class="cockpit-grid">
      <!-- Speed -->
      <div class="touch-card" onclick="toggleSpeedUnits()">
        <div class="card-top">
          <span class="card-label">Ground Speed</span>
          <span class="card-toggle-hint" id="speed-unit-tag">KM/H</span>
        </div>
        <div class="card-main">
          <span id="val-dash-speed" class="card-val">--</span>
          <span id="label-dash-speed-unit" class="card-unit">km/h</span>
        </div>
        <div class="meter-bar-track">
          <div id="bar-speed" class="meter-bar-fill"></div>
        </div>
      </div>

      <!-- Coolant Temp -->
      <div class="touch-card">
        <div class="card-top">
          <span class="card-label">Engine Coolant</span>
        </div>
        <div class="card-main">
          <span id="val-dash-coolant" class="card-val">--</span>
          <span class="card-unit">°C</span>
        </div>
        <div class="meter-bar-track">
          <div id="bar-coolant" class="meter-bar-fill"></div>
        </div>
      </div>

      <!-- Throttle / TPS -->
      <div class="touch-card">
        <div class="card-top">
          <span class="card-label">Throttle (TPS)</span>
        </div>
        <div class="card-main">
          <span id="val-dash-throttle" class="card-val">--</span>
          <span class="card-unit">%</span>
        </div>
        <div class="meter-bar-track">
          <div id="bar-throttle" class="meter-bar-fill"></div>
        </div>
      </div>

      <!-- Battery Voltage -->
      <div class="touch-card">
        <div class="card-top">
          <span class="card-label">Battery Voltage</span>
        </div>
        <div class="card-main">
          <span id="val-dash-voltage" class="card-val">--</span>
          <span class="card-unit">V</span>
        </div>
        <div class="meter-bar-track">
          <div id="bar-voltage" class="meter-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: Dedicated Live Log & Yamaha Diagnostic Tools -->
  <div id="tab-log" class="view-panel">
    <div class="disc-section">
      <div class="disc-title">Yamaha Powersports Protocol Tools</div>
      <div class="action-grid">
        <button class="btn-touch yamaha" onclick="probeYamahaPayload()">🔍 Auto-Probe Yamaha ECU</button>
        <button class="btn-touch secondary" onclick="quickQuery('2101')">Send UDS 2101</button>
        <button class="btn-touch secondary" onclick="quickQuery('2102')">Send UDS 2102</button>
        <button class="btn-touch secondary" onclick="quickQuery('22F40C')">Send UDS 22F40C</button>
        <button class="btn-touch secondary" onclick="quickQuery('221000')">Send UDS 221000</button>
        <button class="btn-touch secondary" onclick="quickQuery('ATRV')">Read Battery (ATRV)</button>
        <button class="btn-touch secondary" onclick="startCANMonitor()">Passive CAN Monitor (ATMA)</button>
      </div>
    </div>

    <div class="disc-section" style="flex:1; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="disc-title">Live Serial Log</div>
        <div style="display:flex; gap:0.4rem;">
          <button class="btn-touch secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="copyDebugLog()">Copy Log</button>
          <button class="btn-touch secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="clearDebugLog()">Clear</button>
        </div>
      </div>
      <div id="live-terminal" class="terminal-box">
        <div style="color:var(--text-muted);">Console ready. Connect to RMAX to view stream...</div>
      </div>
    </div>
  </div>

  <!-- Real-time Bottom Log Strip -->
  <div style="margin-top:0.75rem;">
    <div id="log">System initialized. Touch Connect to start.</div>
  </div>

  <!-- Bottom Touch Dock -->
  <div class="touch-dock">
    <button class="dock-btn active" id="btn-tab-dash" onclick="switchTab('tab-dash')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <span>Cockpit</span>
    </button>
    <button class="dock-btn" id="btn-tab-log" onclick="switchTab('tab-log')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>Live Log</span>
    </button>

    <button id="btn-connect" class="dock-action-btn" onclick="handleConnectClick()">
      <span>Connect</span>
    </button>
  </div>

  <script>
    /* ==========================================================
       APP CONFIGURATION & VERSION
       ========================================================== */
    const APP_VERSION = "v1.1.0";
    document.getElementById('app-version-badge').innerText = APP_VERSION;

    window.onerror = function(msg, url, line) {
      logDebug(`[ERROR] ${msg} (L${line})`, 'err');
      return false;
    };

    const SERVICE_UUIDS = [
      '0000fff0-0000-1000-8000-00805f9b34fb',
      '0000ffe0-0000-1000-8000-00805f9b34fb',
      '6e400001-b5a3-f393-e0a9-e50e24dcca9e'
    ];

    let bleDevice = null;
    let writeChar = null;
    let readChar = null;
    let rxBuffer = '';
    let isPolling = false;
    let isSimulator = false;
    let activeTab = 'tab-dash';
    let speedUnit = 'kmh';
    let activeYamahaCommand = '2101'; // Default Yamaha UDS Query

    function log(msg) {
      const el = document.getElementById('log');
      if (el) el.innerText = msg;
      logDebug(msg);
    }

    function logDebug(msg, type = 'info') {
      const box = document.getElementById('live-terminal');
      if (!box) return;
      const time = new Date().toISOString().substring(11, 23);
      const entry = document.createElement('div');
      
      if (type === 'tx') {
        entry.style.color = 'var(--cyan)';
        entry.innerText = `[${time}] ➜ TX: ${msg}`;
      } else if (type === 'rx') {
        entry.style.color = 'var(--green)';
        entry.innerText = `[${time}] 🠔 RX: ${msg}`;
      } else if (type === 'err') {
        entry.style.color = 'var(--red)';
        entry.innerText = `[${time}] ⚠️ ${msg}`;
      } else if (type === 'warn') {
        entry.style.color = 'var(--amber)';
        entry.innerText = `[${time}] ⚡ ${msg}`;
      } else {
        entry.style.color = 'var(--text-muted)';
        entry.innerText = `[${time}] ${msg}`;
      }

      box.appendChild(entry);
      box.scrollTop = box.scrollHeight;
    }

    window.clearDebugLog = function() {
      const box = document.getElementById('live-terminal');
      if (box) box.innerHTML = '';
    };

    window.copyDebugLog = function() {
      const box = document.getElementById('live-terminal');
      if (!box) return;
      navigator.clipboard.writeText(box.innerText)
        .then(() => alert("Debug log copied to clipboard!"))
        .catch(() => alert("Please manually select and copy text."));
    };

    window.switchTab = function(tabId) {
      activeTab = tabId;
      const tabs = ['tab-dash', 'tab-log'];
      tabs.forEach(t => {
        const btn = document.getElementById('btn-' + t);
        if (btn) btn.classList.toggle('active', t === tabId);

        const panel = document.getElementById(t);
        if (panel) panel.style.display = (t === tabId) ? 'flex' : 'none';
      });

      if ((bleDevice?.gatt?.connected || isSimulator) && !isPolling && tabId === 'tab-dash') {
        startPolling();
      }
    };

    window.toggleSpeedUnits = function() {
      speedUnit = (speedUnit === 'kmh') ? 'mph' : 'kmh';
      document.getElementById('speed-unit-tag').innerText = speedUnit.toUpperCase();
      document.getElementById('label-dash-speed-unit').innerText = (speedUnit === 'kmh') ? 'km/h' : 'mph';
      log(`Speed units: ${speedUnit.toUpperCase()}`);
    };

    window.toggleFullscreen = function() {
      const doc = document;
      const docEl = doc.documentElement;
      const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      const exitFs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
      const isFs = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

      if (requestFs && exitFs) {
        try {
          if (!isFs) {
            const p = requestFs.call(docEl);
            if (p && p.catch) p.catch(() => {});
          } else {
            const p = exitFs.call(doc);
            if (p && p.catch) p.catch(() => {});
          }
        } catch (err) {
          logDebug("Fullscreen error: " + err.message, 'err');
        }
      } else {
        logDebug("Fullscreen unavailable on iOS WebKit. Use Add to Home Screen.", 'warn');
      }
    };

    /* Bluetooth Communication */
    window.handleConnectClick = async function() {
      if (bleDevice?.gatt?.connected) disconnect();
      else await connect();
    };

    async function connect() {
      if (isSimulator) toggleSimulator();
      try {
        if (!navigator.bluetooth) throw new Error("Web Bluetooth unavailable. Open in Bluefy.");

        logDebug("Opening Bluetooth pairing prompt...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: SERVICE_UUIDS
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        logDebug("Connecting to GATT server...");
        const server = await bleDevice.gatt.connect();
        await new Promise(r => setTimeout(r, 300));

        let service = null;
        for (const uuid of SERVICE_UUIDS) {
          try {
            service = await server.getPrimaryService(uuid);
            if (service) break;
          } catch (e) {}
        }
        if (!service) throw new Error("No UART BLE service found.");

        await new Promise(r => setTimeout(r, 200));
        const chars = await service.getCharacteristics();
        writeChar = null; readChar = null;

        for (const char of chars) {
          if (char.properties.write || char.properties.writeWithoutResponse) writeChar = char;
          if (char.properties.notify || char.properties.indicate) readChar = char;
        }

        if (!writeChar || !readChar) throw new Error("TX/RX characteristics not resolved.");

        await readChar.startNotifications();
        readChar.addEventListener('characteristicvaluechanged', handleNotification);

        const statusEl = document.getElementById('status');
        const btnConnect = document.getElementById('btn-connect');
        if (statusEl) { statusEl.innerText = "CONNECTED"; statusEl.className = "status-badge connected"; }
        if (btnConnect) { btnConnect.innerText = "Disconnect"; btnConnect.classList.add("disconnect"); }

        await initYamahaELM327();
        startPolling();

      } catch (err) {
        logDebug("BLE Error: " + err.message, 'err');
        log("BLE Error: " + err.message);
        disconnect();
      }
    }

    function disconnect() {
      if (bleDevice?.gatt?.connected) bleDevice.gatt.disconnect();
      onDisconnected();
    }

    function onDisconnected() {
      isPolling = false;
      const statusEl = document.getElementById('status');
      const btnConnect = document.getElementById('btn-connect');
      if (statusEl) { statusEl.innerText = "DISCONNECTED"; statusEl.className = "status-badge"; }
      if (btnConnect) { btnConnect.innerText = "Connect"; btnConnect.classList.remove("disconnect"); }
      logDebug("Device disconnected.", 'warn');
      log("Disconnected.");
    }

    let responseResolver = null;
    function handleNotification(event) {
      const chunk = new TextDecoder().decode(event.target.value);
      rxBuffer += chunk;
      if (rxBuffer.includes('>')) {
        if (responseResolver) {
          const res = rxBuffer.replace(/>/g, '').trim();
          rxBuffer = '';
          responseResolver(res);
          responseResolver = null;
        }
      }
    }

    async function writeBLE(data) {
      if (!writeChar) return;
      if (writeChar.properties.writeWithoutResponse && writeChar.writeValueWithoutResponse) {
        await writeChar.writeValueWithoutResponse(data);
      } else if (writeChar.writeValueWithResponse) {
        await writeChar.writeValueWithResponse(data);
      } else {
        await writeChar.writeValue(data);
      }
    }

    async function sendCommand(cmd, timeoutMs = 2500) {
      if (isSimulator) {
        return new Promise(resolve => {
          setTimeout(() => resolve(getSimulatedResponse(cmd)), 35);
        });
      }

      return new Promise(async (resolve) => {
        rxBuffer = '';
        logDebug(cmd, 'tx');

        const timer = setTimeout(() => {
          responseResolver = null;
          logDebug(`${cmd} ➜ TIMEOUT (${timeoutMs}ms)`, 'err');
          resolve("TIMEOUT");
        }, timeoutMs);

        responseResolver = (response) => {
          clearTimeout(timer);
          logDebug(`${cmd} ➜ ${response || '[EMPTY]'}`, 'rx');
          resolve(response);
        };

        const enc = new TextEncoder().encode(cmd + '\r');
        try {
          await writeBLE(enc);
        } catch (e) {
          clearTimeout(timer);
          responseResolver = null;
          logDebug(`Write Error on ${cmd}: ${e.message}`, 'err');
          resolve("WRITE_ERR");
        }
      });
    }

    /* Yamaha Powersports Initialization Routine */
    async function initYamahaELM327() {
      logDebug("--- INITIALIZING YAMAHA RMAX CAN PROTOCOL ---", 'warn');
      await writeBLE(new TextEncoder().encode('\r\r\r'));
      await new Promise(r => setTimeout(r, 200));

      await sendCommand("ATD", 1500);    // Defaults
      await sendCommand("ATZ", 3000);    // Reset
      await new Promise(r => setTimeout(r, 600));

      await sendCommand("ATE0", 1500);   // Echo off
      await sendCommand("ATL0", 1500);   // Linefeeds off
      await sendCommand("ATS0", 1500);   // Spaces off
      await sendCommand("ATH0", 1500);   // Headers off
      await sendCommand("ATAT2", 1500);  // Adaptive timing
      await sendCommand("ATSTFF", 1500); // Extended timeout

      // Lock to Yamaha CAN 11-bit 500k & Engine ECU Address 7E0
      await sendCommand("ATSP6", 2000);  // ISO 15765-4 CAN (11/500)
      await sendCommand("ATSH7E0", 1500);// Yamaha Primary ECU ID

      logDebug("Auto-probing Yamaha UDS Data Identifier (2101 / 22F40C)...");
      const test21 = await sendCommand("2101", 3000);

      if (test21.includes("6101") || (!test21.includes("7F") && !test21.includes("NO DATA"))) {
        activeYamahaCommand = "2101";
        logDebug("✅ Locked to Yamaha Mode 21 01 Telemetry Stream!", 'rx');
      } else {
        const test22 = await sendCommand("22F40C", 3000);
        if (test22.includes("62F40C")) {
          activeYamahaCommand = "22F40C";
          logDebug("✅ Locked to Yamaha Mode 22 F40C Stream!", 'rx');
        } else {
          activeYamahaCommand = "2101";
          logDebug("Ready. If values don't stream, tap 'Auto-Probe' in Live Log.", 'warn');
        }
      }
      log("Connected to Yamaha RMAX! Streaming...");
    }

    /* Live Polling Loop for Yamaha Engine Stream */
    async function startPolling() {
      if (isPolling) return;
      isPolling = true;

      while (isPolling && (bleDevice?.gatt?.connected || isSimulator)) {
        if (activeTab === 'tab-dash') {
          // Poll Yamaha Telemetry Frame
          const res = await sendCommand(activeYamahaCommand, 1500);
          parseYamahaFrame(res);

          // Update Voltage
          const voltRes = await sendCommand("ATRV", 800);
          parseVoltage(voltRes);
        }
        await new Promise(r => setTimeout(r, 60));
      }
      isPolling = false;
    }

    /* Yamaha UDS Payload Decoders */
    function parseYamahaFrame(raw) {
      if (!raw || raw.includes("7F") || raw.includes("NO DATA") || raw.includes("TIMEOUT")) return;
      const clean = String(raw).replace(/[\s\r\n>]/g, '');

      // Decoder 1: Mode 21 01 Multi-byte Block (61 01 ...)
      if (clean.includes("6101")) {
        const idx = clean.indexOf("6101");
        const payload = clean.substring(idx + 4);
        
        // Extract bytes
        const bytes = [];
        for (let i = 0; i < payload.length; i += 2) {
          bytes.push(parseInt(payload.substr(i, 2), 16));
        }

        if (bytes.length >= 4) {
          // Yamaha RPM: typically Bytes 0 & 1 or Bytes 2 & 3
          let rpm = Math.round(((bytes[0] * 256) + bytes[1]) / 4);
          if (rpm > 12000 || rpm < 0) rpm = Math.round(((bytes[2] * 256) + bytes[3]) / 4);
          if (!isNaN(rpm)) updateRPM(rpm);

          // Coolant Temp (Bytes 2 or 4)
          if (bytes.length >= 3) {
            let temp = bytes[2] - 40;
            if (temp < -40 || temp > 150) temp = bytes[3] - 40;
            if (!isNaN(temp)) updateCoolant(temp);
          }

          // Throttle (Byte 3 or 4)
          if (bytes.length >= 4) {
            let tps = Math.round((bytes[3] * 100) / 255);
            if (!isNaN(tps)) updateThrottle(tps);
          }
        }
      }
      // Decoder 2: Mode 22 F40C RPM (62 F4 0C A B)
      else if (clean.includes("62F40C")) {
        const idx = clean.indexOf("62F40C");
        const a = parseInt(clean.substring(idx + 6, idx + 8), 16);
        const b = parseInt(clean.substring(idx + 8, idx + 10), 16);
        const rpm = Math.round(((a * 256) + b) / 4);
        if (!isNaN(rpm)) updateRPM(rpm);
      }
    }

    function updateRPM(rpm) {
      document.getElementById('val-dash-rpm').innerText = rpm;
      updateTachometer(rpm);
    }

    function updateCoolant(temp) {
      document.getElementById('val-dash-coolant').innerText = temp;
      const pct = Math.min(100, Math.max(0, (temp / 120) * 100));
      const bar = document.getElementById('bar-coolant');
      if (bar) {
        bar.style.width = pct + '%';
        bar.style.background = temp > 105 ? 'var(--red)' : temp > 95 ? 'var(--amber)' : 'var(--cyan)';
      }
    }

    function updateThrottle(tps) {
      document.getElementById('val-dash-throttle').innerText = tps;
      const bar = document.getElementById('bar-throttle');
      if (bar) bar.style.width = tps + '%';
    }

    function parseVoltage(raw) {
      const match = String(raw).match(/([0-9]+\.?[0-9]*)/);
      if (match && match[1]) {
        document.getElementById('val-dash-voltage').innerText = match[1];
        const numV = parseFloat(match[1]);
        const pct = Math.min(100, Math.max(0, ((numV - 10) / 5) * 100));
        const bar = document.getElementById('bar-voltage');
        if (bar) bar.style.width = pct + '%';
      }
    }

    function updateTachometer(rpm) {
      const maxRPM = 9000;
      const arcLength = 293.2;
      const pct = Math.min(1, Math.max(0, rpm / maxRPM));
      const offset = arcLength - (pct * arcLength);

      const bar = document.getElementById('gauge-rpm-bar');
      const redlineEl = document.getElementById('redline-alert');

      if (bar) {
        bar.style.strokeDashoffset = offset;
        if (rpm >= 7800) {
          bar.style.stroke = 'var(--redline)';
          bar.style.filter = 'drop-shadow(0 0 12px var(--redline))';
          if (redlineEl) redlineEl.classList.add('active');
        } else if (rpm >= 5500) {
          bar.style.stroke = 'var(--amber)';
          bar.style.filter = 'drop-shadow(0 0 8px var(--amber))';
          if (redlineEl) redlineEl.classList.remove('active');
        } else {
          bar.style.stroke = 'var(--cyan)';
          bar.style.filter = 'drop-shadow(0 0 8px var(--cyan))';
          if (redlineEl) redlineEl.classList.remove('active');
        }
      }
    }

    /* Yamaha Diagnostic Prober */
    window.probeYamahaPayload = async function() {
      if (!bleDevice?.gatt?.connected && !isSimulator) return alert("Connect to OBD-II first.");
      isPolling = false;

      logDebug("--- PROBING YAMAHA DIAGNOSTIC IDENTIFIERS ---", 'warn');
      const probeList = [
        "2101", "2102", "2103", "2104", "2105", 
        "22F40C", "22F405", "22F40D", "22F411", "221000", "220101"
      ];

      for (const cmd of probeList) {
        const res = await sendCommand(cmd, 2500);
        if (!res.includes("7F") && !res.includes("NO DATA") && !res.includes("TIMEOUT")) {
          logDebug(`🎯 WORKING YAMAHA IDENTIFIER FOUND: ${cmd} ➜ ${res}`, 'rx');
          activeYamahaCommand = cmd;
        }
        await new Promise(r => setTimeout(r, 60));
      }

      logDebug(`Probe complete. Active query set to: ${activeYamahaCommand}`, 'warn');
    };

    window.quickQuery = async function(cmd) {
      if (!bleDevice?.gatt?.connected && !isSimulator) return alert("Connect to OBD-II first.");
      isPolling = false;
      logDebug(`Sending manual command: ${cmd}`, 'tx');
      const res = await sendCommand(cmd, 3000);
      logDebug(`Result: ${res}`, 'rx');
    };

    window.startCANMonitor = async function() {
      if (!bleDevice?.gatt?.connected && !isSimulator) return alert("Connect to OBD-II first.");
      isPolling = false;
      logDebug("--- STARTING PASSIVE CAN MONITOR (ATMA) ---", 'warn');
      logDebug("Listening to broadcast frames for 4 seconds...");
      await writeBLE(new TextEncoder().encode('ATMA\r'));
      setTimeout(async () => {
        await writeBLE(new TextEncoder().encode('\r')); // Stop monitor
        logDebug("Passive CAN monitor stopped.", 'warn');
      }, 4000);
    };

    /* Simulation Mode */
    window.toggleSimulator = function() {
      isSimulator = !isSimulator;
      const statusEl = document.getElementById('status');

      if (isSimulator) {
        if (bleDevice?.gatt?.connected) disconnect();
        if (statusEl) { statusEl.innerText = "SIMULATOR"; statusEl.className = "status-badge simulated"; }
        logDebug("Simulator active: Generating synthetic Yamaha telemetry.", 'warn');
        startPolling();
      } else {
        isPolling = false;
        if (statusEl) { statusEl.innerText = "DISCONNECTED"; statusEl.className = "status-badge"; }
        logDebug("Simulator deactivated.", 'warn');
      }
    };

    function getSimulatedResponse(cmd) {
      if (cmd.startsWith("AT")) {
        if (cmd === "ATDP") return "ISO 15765-4 (CAN 11/500)";
        if (cmd === "ATRV") return (14.2 + Math.sin(Date.now() / 2500) * 0.3).toFixed(1) + "V";
        return "OK";
      }
      if (cmd === "2101") {
        const time = Date.now() / 1000;
        const rpm = Math.round(3500 + Math.sin(time * 0.9) * 2500) * 4;
        const a = (rpm >> 8) & 0xFF, b = rpm & 0xFF;
        const coolant = Math.round(88 + Math.sin(time * 0.1) * 4) + 40;
        const tps = Math.round((45 + Math.sin(time * 0.7) * 30) * 255 / 100);
        return `61 01 ${a.toString(16).padStart(2,'0')} ${b.toString(16).padStart(2,'0')} ${coolant.toString(16).padStart(2,'0')} ${tps.toString(16).padStart(2,'0')}`;
      }
      return "61 01 1A F8 80 40";
    }
  </script>
